# Enhanced CI Pipeline - Security, Quality & Engineering Gates
# ENG-CI-01 (2026-09-15): coverage/audit messaging must be honest (no fake ≥80% / silent audit soft).

name: CI - Security + Quality + Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard security signal (secrets). NPM audit lives in npm-audit-advisory — does not greenwash this job.
  # Job id `security` kept so required checks / dashboards that key on that name stay stable.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanning (GitHub + custom)
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # Soft by design (legacy exceljs/xlsx transitive). Job name + Step Summary state findings clearly.
  # continue-on-error at JOB level so workflow continues; script still prints ADVISORY when dirty.
  npm-audit-advisory:
    name: "NPM Audit (advisory soft — does not block verify)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: NPM Audit advisory (omit=dev, level=high)
        env:
          NPM_AUDIT_MODE: advisory
          NPM_AUDIT_LEVEL: high
          NPM_AUDIT_OMIT_DEV: "1"
        run: node scripts/ci-npm-audit.mjs

  # Mọi migration trong repo phải có trên prod trước khi merge (merge = Vercel tự deploy).
  # Ngoại lệ có lý do: ALLOW_REPO_ONLY trong scripts/sync-check.mjs.
  # Secret là DB URL của role ci_migration_reader (chỉ SELECT version,name trên schema_migrations).
  # Bước đọc DB chạy TRƯỚC checkout và job không có npm ci: không code repo/dependency nào thấy secret.
  sync-check:
    name: "Sync check — migration repo vs prod"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Đọc tên migration trên prod (SKIP nếu thiếu secret)
        id: db
        env:
          SYNC_CHECK_DB_URL: ${{ secrets.SYNC_CHECK_DB_URL }}
          PGCONNECT_TIMEOUT: "15"
        run: |
          if [ -z "$SYNC_CHECK_DB_URL" ]; then
            echo "SKIP: chưa có secret SYNC_CHECK_DB_URL (PR từ fork/Dependabot cũng không nhận secret)"
            exit 0
          fi
          psql "$SYNC_CHECK_DB_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(name order by version), '[]') from supabase_migrations.schema_migrations where name is not null" \
            > "$RUNNER_TEMP/db-names.json"
          echo "have=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.db.outputs.have == '1'
        with:
          persist-credentials: false

      - name: So migration repo vs prod
        if: steps.db.outputs.have == '1'
        run: node scripts/sync-check.mjs --db-names "$RUNNER_TEMP/db-names.json" --no-deploy --strict

  verify:
    # Quality gate is independent of npm-audit-advisory (soft deps).
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      
      - name: Guard Legacy Table Names
        run: node scripts/guard-legacy-table-names.mjs

      - name: Docs links check
        run: npm run docs:links:check

      - name: Layout drift check
        run: npm run layout:drift-check

      - name: Layout typography check
        run: npm run layout:typography-check

      - name: Repo hygiene
        run: npm run repo:hygiene

      # audit:views cần Postgres local :54322 — chỉ trong local:golden:verify, không CI

      - name: Dead code scan (warn-only; script exits 0 unless DEAD_CODE_STRICT=1)
        run: npm run dead-code:scan
      
      - name: Lint (ESLint + CSSD Architecture)
        run: npm run lint && npm run lint:cssd-architecture

      - name: CSSD module verify
        run: npm run verify:cssd
      
      - name: Unit tests + coverage report (no global % gate)
        run: npm run test:coverage
      
      - name: Engineering Contract Verify (warn unless ENGINEERING_GATE_STRICT=1)
        run: npm run verify:engineering
      
      - name: Production Build
        run: npm run build

  e2e:
    # Job id `e2e` kept stable for required checks; skip messaging is in step + scripts/e2e-ci-gate.mjs
    runs-on: ubuntu-latest
    needs: verify
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # scripts/e2e-ci-gate.mjs: SKIP exit 0 nếu thiếu secrets; fail cứng khi có secrets và test fail
      - name: Playwright E2E (or intentional SKIP if secrets missing)
        run: npm run test:e2e:ci
