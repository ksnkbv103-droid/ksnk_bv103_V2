name: Security & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ENG-CI-01: full tree, moderate level, advisory soft — Step Summary states findings.
  # Does not silently continue-on-error on a step named like a hard gate.
  npm-audit-advisory:
    name: "NPM Audit full-tree (advisory soft)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: NPM Audit advisory (full tree, level=moderate)
        env:
          NPM_AUDIT_MODE: advisory
          NPM_AUDIT_LEVEL: moderate
        run: node scripts/ci-npm-audit.mjs
