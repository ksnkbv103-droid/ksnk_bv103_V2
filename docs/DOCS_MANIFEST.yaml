version: 2

tiers:
  wiki:
    description: LLM-maintained synthesis — entity, concepts, index
    glob: "docs/wiki/**"
    human_readable: true
    agent_maintained: true
  core:
    description: SSOT vận hành — 11 đọc thường + 6 ký/ADR (xem docs/README)
    glob: "docs/core/*.md"
    max_files: 13
  modules:
    description: Domain đang dùng theo module — cấm _audit / A-B / tên ngày
    glob: "docs/modules/**"
  reference:
    description: Kiến trúc sống, ADR, runbook
    glob: "docs/reference/**"
  ux:
    description: IA / tương tác — một file principles
    glob: "docs/ux/*.md"
    max_files: 1
  data:
    description: Machine source — script parse, không đọc tay
    glob: "docs/data/**"
    human_readable: false

entrypoints:
  human: docs/README.md
  ssot_map: docs/ssot-map.md
  agent: CLAUDE.md
  read_minimum: docs/core/read-minimum.md
  wiki_schema: docs/wiki/WIKI_SCHEMA.md
  wiki_index: docs/wiki/index.md

routes:
  cssd-workflow:
    read:
      - docs/core/read-minimum.md
      - docs/modules/cssd/README.md
      - docs/modules/cssd/domain-overview.md
      - docs/core/implementation-mapping.md
  giam-sat-scoring:
    read:
      - docs/modules/giam-sat/bang-kiem-overview.md
      - docs/wiki/concepts.md
  nkbv-clinical:
    read:
      - docs/modules/nkbv/README.md
      - docs/modules/nkbv/clinical-forms.md
    data:
      - docs/data/nkbv/algorithms/
  bang-kiem-seed:
    data:
      - docs/data/bang-kiem/canonical-36.md
      - docs/data/bang-kiem/raw-forms-full.md

scan_roots:
  - docs
  - CLAUDE.md
  - .claude/skills
  - .claude/rules

rules:
  living_no_audit_prefix: true
  living_no_ab_gates: true
  one_topic_one_file: true
